<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Rotatron — Play.fun</title>
    <meta name="description" content="Rotatron — neon/cyberpunk arcade puzzle, Play.fun edition." />
    <meta name="theme-color" content="#0a0612" />
    <meta name="color-scheme" content="dark" />

    <!-- Play.fun creator API key (user UUID from dashboard).
         id="ogp-key-meta" is required by the SDK's reward-claim flow. -->
    <meta name="x-ogp-key" content="d8ff06b7-76f6-4577-9eb7-2560fea24c69" id="ogp-key-meta" />

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="stylesheet" href="./style.css" />
    <style>
      /* Reserve the top 75px for the Play.fun SDK chrome.
         #playfun-content is positioned at top:75 and uses transform to
         become the containing block for ALL its position:fixed descendants
         (#scene, #hud, .heat-rail, .hud-row, .pause-btn, etc.). Each child
         resolves its top/bottom/inset against the wrapper instead of the
         viewport — so the entire game lives below the bar with zero
         per-element overrides. */
      #playfun-topbar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 75px;
        background: #0a0612;
        z-index: 1;
        pointer-events: none;
      }
      #playfun-content {
        position: fixed;
        top: 75px;
        right: 0;
        bottom: 0;
        left: 0;
        transform: translateZ(0);
      }
      /* Force the Play.fun SDK widget container's background to black.
         The SDK widget uses Tailwind's .bg-transparent
         (\`background-color: #0000\`). Override the utility class directly
         so this beats anything Tailwind's cascade layer might do. */
      .bg-transparent {
        background-color: #000 !important;
      }
    </style>

    <!-- Play.fun Browser SDK -->
    <script src="https://sdk.play.fun"></script>
  </head>
  <body>
    <div id="playfun-content">
      <canvas id="scene"></canvas>
      <div id="hud"></div>
    </div>
    <div id="playfun-topbar" aria-hidden="true"></div>
    <script type="module" src="/src/playfun-main.js"></script>
  </body>
</html>
