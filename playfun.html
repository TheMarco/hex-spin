<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Rotatron — Play.fun</title>
    <meta name="description" content="Rotatron — neon/cyberpunk arcade puzzle, Play.fun edition." />
    <meta name="theme-color" content="#0a0612" />
    <meta name="color-scheme" content="dark" />

    <!-- Play.fun creator API key (user UUID from dashboard).
         id="ogp-key-meta" is required by the SDK's reward-claim flow. -->
    <meta name="x-ogp-key" content="d8ff06b7-76f6-4577-9eb7-2560fea24c69" id="ogp-key-meta" />

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="stylesheet" href="./style.css" />
    <style>
      /* Reserve the top 75px for the Play.fun SDK chrome by shifting the
         game's canvas and HUD down so their combined area starts at y=75.
         Three.js renders to the smaller area (main.js subtracts the inset
         from the renderer/camera height). The #playfun-topbar div is a
         color-matched backdrop so the chrome area is visually consistent
         even before the SDK paints itself. */
      #playfun-topbar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 75px;
        background: #0a0612;
        z-index: 1;
        pointer-events: none;
      }
      #scene,
      #hud {
        top: 75px !important;
        height: calc(100% - 75px) !important;
      }
    </style>

    <!-- Play.fun Browser SDK -->
    <script src="https://sdk.play.fun"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="playfun-topbar" aria-hidden="true"></div>
    <script type="module" src="/src/playfun-main.js"></script>
  </body>
</html>
