<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Rotatron — Play.fun</title>
    <meta name="description" content="Rotatron — neon/cyberpunk arcade puzzle, Play.fun edition." />
    <meta name="theme-color" content="#0a0612" />
    <meta name="color-scheme" content="dark" />

    <!-- Play.fun creator API key (user UUID from dashboard).
         id="ogp-key-meta" is required by the SDK's reward-claim flow. -->
    <meta name="x-ogp-key" content="d8ff06b7-76f6-4577-9eb7-2560fea24c69" id="ogp-key-meta" />

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="stylesheet" href="./style.css" />
    <style>
      /* Reserve the top 75px for the Play.fun SDK chrome. The canvas is
         shifted down + shrunk (main.js renders to effectiveHeight, which
         subtracts the inset). The HUD's container stays fixed-to-viewport,
         but each top-anchored HUD element gets +75px added to its top so
         it lands below the bar. Bottom-anchored HUD controls (pause / mute /
         direction) stay put. */
      #playfun-topbar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 75px;
        background: #0a0612;
        z-index: 1;
        pointer-events: none;
      }
      #scene {
        top: 75px !important;
        height: calc(100% - 75px) !important;
      }
      .heat-rail {
        top: 75px !important;
      }
      .hud-row {
        top: calc(75px + 44px + env(safe-area-inset-top, 0px)) !important;
      }
      @media (max-width: 720px) {
        .hud-row {
          top: calc(75px + 40px + env(safe-area-inset-top, 0px)) !important;
        }
        .demo-narration {
          top: calc(75px + 130px + env(safe-area-inset-top, 0px)) !important;
        }
      }
    </style>

    <!-- Play.fun Browser SDK -->
    <script src="https://sdk.play.fun"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="playfun-topbar" aria-hidden="true"></div>
    <script type="module" src="/src/playfun-main.js"></script>
  </body>
</html>
